[supervisord]
nodaemon=true
user=root
logfile=/var/log/supervisor/supervisord.log
pidfile=/var/run/supervisord.pid
childlogdir=/var/log/supervisor

[unix_http_server]
file=/var/run/supervisor.sock

[supervisorctl]
serverurl=unix:///var/run/supervisor.sock

[rpcinterface:supervisor]
supervisor.rpcinterface_factory = supervisor.rpcinterface:make_main_rpcinterface

[program:xvfb]
command=/usr/bin/Xvfb %(ENV_DISPLAY)s -screen 0 %(ENV_SCREEN_RESOLUTION)s -ac +extension GLX +render -noreset
autostart=true
autorestart=true
priority=10
stdout_logfile=/var/log/supervisor/xvfb.log
stderr_logfile=/var/log/supervisor/xvfb-err.log

[program:x11vnc]
command=/usr/bin/x11vnc -display %(ENV_DISPLAY)s -forever -shared -rfbport 5900 -nopw -noxdamage
autostart=true
autorestart=true
priority=20
startsecs=3
startretries=10
stdout_logfile=/var/log/supervisor/x11vnc.log
stderr_logfile=/var/log/supervisor/x11vnc-err.log

[program:websockify]
command=/usr/bin/websockify --web /usr/share/novnc 6080 localhost:5900
autostart=true
autorestart=true
priority=30
startsecs=2
stdout_logfile=/var/log/supervisor/websockify.log
stderr_logfile=/var/log/supervisor/websockify-err.log

[program:openbox]
command=/usr/bin/openbox
environment=DISPLAY="%(ENV_DISPLAY)s",HOME="/root"
autostart=true
autorestart=true
priority=15
startsecs=2
stdout_logfile=/var/log/supervisor/openbox.log
stderr_logfile=/var/log/supervisor/openbox-err.log

[program:desktop-bg]
command=/usr/bin/xsetroot -solid "#1e1e2e"
environment=DISPLAY="%(ENV_DISPLAY)s"
autostart=true
autorestart=false
priority=16
startsecs=0
stdout_logfile=/dev/null
stderr_logfile=/dev/null


command=sudo -u node env \
  DISPLAY=%(ENV_DISPLAY)s \
  HOME=/home/node \
  PUPPETEER_EXECUTABLE_PATH=/usr/local/bin/chromium-docker \
  CHROMIUM_PATH=/usr/local/bin/chromium-docker \
  CHROME_PATH=/usr/local/bin/chromium-docker \
  CHROMIUM_EXECUTABLE_PATH=/usr/local/bin/chromium-docker \
  PUPPETEER_SKIP_CHROMIUM_DOWNLOAD=true \
  /usr/local/bin/openclaw gateway run --allow-unconfigured --bind lan --port 18789
environment=DISPLAY="%(ENV_DISPLAY)s"
autostart=true
autorestart=true
priority=40
startsecs=8
stdout_logfile=/dev/fd/1
stdout_logfile_maxbytes=0
stderr_logfile=/dev/fd/2
stderr_logfile_maxbytes=0
